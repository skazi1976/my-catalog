<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HaCatalog - גלריית מוצרים</title>
    <meta name="description" content="גלריית מוצרים חדשה - מותגים נחשבים במחירי רצפה עם משלוח ישיר">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📦</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800;900&family=Assistant:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        /* ===== PRODUCTS DATA - EDIT HERE ===== */
        /* Products are defined in the script below */

        :root {
            --bg: #0a0a0f;
            --surface: rgba(255,255,255,0.04);
            --surface-hover: rgba(255,255,255,0.08);
            --border: rgba(255,255,255,0.06);
            --border-hover: rgba(255,255,255,0.12);
            --text: #ffffff;
            --text-dim: rgba(255,255,255,0.5);
            --text-muted: rgba(255,255,255,0.3);
            --accent-green: #00e676;
            --accent-orange: #FF6B00;
            --accent-orange-light: #FF8C40;
            --price-green: #25D366;
            --whatsapp: #25D366;
            --whatsapp-dark: #128C7E;
            --telegram: #0088cc;
            --radius: 16px;
            --radius-sm: 10px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Assistant', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
        }

        h1, h2, h3, h4, h5, h6 {
            font-family: 'Heebo', sans-serif;
        }

        /* ===== HEADER ===== */
        .header {
            background: linear-gradient(135deg, #0f0f1a 0%, #1a1025 50%, #0f0f1a 100%);
            border-bottom: 1px solid var(--border);
            padding: 16px 0;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        .header-inner {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            font-family: 'Heebo', sans-serif;
            font-size: 26px;
            font-weight: 900;
            background: linear-gradient(135deg, var(--accent-green), #ffd700);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -1px;
        }
        .header-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: linear-gradient(135deg, var(--accent-orange), var(--accent-orange-light));
            color: #fff;
            font-family: 'Heebo', sans-serif;
            font-weight: 700;
            font-size: 14px;
            padding: 8px 16px;
            border-radius: 20px;
            animation: pulse-badge 2s infinite;
        }
        @keyframes pulse-badge {
            0%, 100% { box-shadow: 0 0 0 0 rgba(255,107,0,0.4); }
            50% { box-shadow: 0 0 0 8px rgba(255,107,0,0); }
        }

        /* ===== HERO ===== */
        .hero {
            text-align: center;
            padding: 40px 20px 30px;
            position: relative;
            overflow: hidden;
        }
        .hero::before {
            content: '';
            position: absolute;
            top: -50%;
            left: 50%;
            transform: translateX(-50%);
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(255,107,0,0.06) 0%, transparent 70%);
            pointer-events: none;
            animation: glow 15s infinite;
        }
        @keyframes glow {
            0%, 100% { opacity: 0.5; transform: translateX(-50%) scale(1); }
            50% { opacity: 1; transform: translateX(-50%) scale(1.2); }
        }
        .hero h1 {
            font-size: 32px;
            font-weight: 900;
            margin-bottom: 8px;
            position: relative;
        }
        .hero h1 span {
            background: linear-gradient(135deg, var(--accent-orange), var(--accent-orange-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .hero p {
            color: var(--text-dim);
            font-size: 16px;
            position: relative;
        }
        .product-count {
            display: inline-block;
            margin-top: 12px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 6px 16px;
            font-size: 13px;
            color: var(--text-dim);
            position: relative;
        }
        .product-count strong {
            color: var(--accent-green);
            font-weight: 700;
        }

        /* ===== PRODUCT GRID ===== */
        .grid-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px 100px;
        }
        .product-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
        }
        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 80px 20px;
            color: var(--text-muted);
        }
        .empty-state .empty-icon {
            font-size: 64px;
            margin-bottom: 16px;
        }
        .empty-state p {
            font-size: 18px;
        }

        /* ===== PRODUCT CARD ===== */
        .product-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
            display: flex;
            flex-direction: column;
            opacity: 0;
            transform: translateY(30px);
        }
        .product-card.visible {
            opacity: 1;
            transform: translateY(0);
            transition: opacity 0.5s ease, transform 0.5s ease, box-shadow 0.3s ease, border-color 0.3s ease;
        }
        .product-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 40px rgba(0,0,0,0.4);
            border-color: var(--border-hover);
        }
        .card-image-wrap {
            position: relative;
            width: 100%;
            padding-top: 100%;
            overflow: hidden;
            cursor: pointer;
            background: #111118;
        }
        .card-image-wrap img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }
        .product-card:hover .card-image-wrap img {
            transform: scale(1.05);
        }
        .card-zoom-icon {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.6);
            border-radius: 50%;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }
        .product-card:hover .card-zoom-icon {
            opacity: 1;
        }
        .card-info {
            padding: 14px 16px 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex: 1;
        }
        .card-title {
            font-family: 'Heebo', sans-serif;
            font-size: 15px;
            font-weight: 700;
            line-height: 1.4;
            color: var(--text);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .card-price {
            font-family: 'Heebo', sans-serif;
            font-size: 22px;
            font-weight: 800;
            color: var(--price-green);
            direction: ltr;
            text-align: right;
        }
        .card-price span {
            font-size: 14px;
            font-weight: 400;
            color: var(--text-muted);
        }
        .buy-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            width: 100%;
            padding: 10px 20px;
            background: linear-gradient(135deg, var(--accent-orange), var(--accent-orange-light));
            color: #fff;
            font-family: 'Heebo', sans-serif;
            font-weight: 700;
            font-size: 14px;
            border: none;
            border-radius: var(--radius-sm);
            cursor: pointer;
            text-decoration: none;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            margin-top: auto;
        }
        .buy-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(255,107,0,0.3);
        }

        /* ===== LIGHTBOX ===== */
        .lightbox-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.92);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            cursor: zoom-out;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
        .lightbox-overlay.active {
            display: flex;
            animation: fadeIn 0.25s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .lightbox-img {
            max-width: 90vw;
            max-height: 85vh;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            animation: scaleIn 0.3s ease;
        }
        @keyframes scaleIn {
            from { transform: scale(0.85); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .lightbox-close {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 44px;
            height: 44px;
            background: rgba(255,255,255,0.1);
            border: none;
            border-radius: 50%;
            color: #fff;
            font-size: 22px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }
        .lightbox-close:hover {
            background: rgba(255,255,255,0.2);
        }
        .lightbox-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 48px;
            height: 48px;
            background: rgba(0,0,0,0.6);
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            color: #fff;
            font-size: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
            z-index: 10;
        }
        .lightbox-nav:hover { background: rgba(0,0,0,0.8); }
        .lightbox-wa-share {
            position: absolute;
            bottom: 70px;
            left: 50%;
            transform: translateX(-50%);
            background: #25D366;
            color: #fff;
            padding: 10px 24px;
            border-radius: 25px;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
            z-index: 10;
            white-space: nowrap;
        }
        .copy-product-link {
            display: block;
            width: 100%;
            text-align: center;
            padding: 8px;
            background: rgba(255,255,255,0.1);
            color: #aaa;
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 10px;
            font-size: 13px;
            cursor: pointer;
            margin-bottom: 6px;
        }
        .copy-product-link:active { background: rgba(255,255,255,0.2); }
        .wa-share-btn {
            display: block;
            text-align: center;
            padding: 10px;
            background: #25D366;
            color: #fff !important;
            border-radius: 10px;
            text-decoration: none;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 6px;
        }
        .lightbox-prev { left: 20px; }
        .lightbox-next { right: 20px; }
        .lightbox-title {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            padding: 8px 20px;
            border-radius: 20px;
            font-family: 'Heebo', sans-serif;
            font-size: 14px;
            color: #fff;
            white-space: nowrap;
            max-width: 90vw;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* ===== SHARE SECTION ===== */
        .share-section {
            max-width: 1200px;
            margin: 0 auto 120px;
            padding: 0 20px;
            text-align: center;
        }
        .share-section h3 {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 16px;
            color: var(--text-dim);
        }
        .share-buttons {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .share-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            border-radius: var(--radius-sm);
            border: none;
            color: #fff;
            font-family: 'Heebo', sans-serif;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            text-decoration: none;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .share-btn:hover {
            transform: scale(1.05);
        }
        .share-btn.whatsapp {
            background: linear-gradient(135deg, var(--whatsapp), var(--whatsapp-dark));
        }
        .share-btn.whatsapp:hover { box-shadow: 0 6px 20px rgba(37,211,102,0.3); }
        .share-btn.telegram {
            background: linear-gradient(135deg, #0088cc, #006fa8);
        }
        .share-btn.telegram:hover { box-shadow: 0 6px 20px rgba(0,136,204,0.3); }
        .share-btn.copy-link {
            background: var(--surface);
            border: 1px solid var(--border);
        }
        .share-btn.copy-link:hover { box-shadow: 0 6px 20px rgba(255,255,255,0.05); }

        /* ===== STICKY WHATSAPP ===== */
        .sticky-wa {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 200;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            background: linear-gradient(135deg, var(--whatsapp), var(--whatsapp-dark));
            color: #fff;
            font-family: 'Heebo', sans-serif;
            font-weight: 700;
            font-size: 15px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 6px 25px rgba(37,211,102,0.4);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .sticky-wa:hover {
            transform: translateX(-50%) scale(1.05);
            box-shadow: 0 8px 30px rgba(37,211,102,0.5);
        }
        .sticky-wa svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        /* ===== TOAST ===== */
        .toast {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: var(--accent-green);
            color: #000;
            padding: 10px 24px;
            border-radius: 20px;
            font-family: 'Heebo', sans-serif;
            font-weight: 700;
            font-size: 14px;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s ease;
            z-index: 300;
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* ===== ADMIN PANEL ===== */
        .admin-panel {
            display: none;
            max-width: 600px;
            margin: 0 auto 40px;
            padding: 24px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
        }
        .admin-panel.active { display: block; }
        .admin-panel h2 {
            font-size: 20px;
            font-weight: 800;
            margin-bottom: 20px;
            color: var(--accent-orange);
        }
        .admin-field {
            margin-bottom: 16px;
        }
        .admin-field label {
            display: block;
            font-family: 'Heebo', sans-serif;
            font-weight: 700;
            font-size: 14px;
            margin-bottom: 6px;
            color: var(--text-dim);
        }
        .admin-field input,
        .admin-field textarea {
            width: 100%;
            padding: 10px 14px;
            background: rgba(255,255,255,0.06);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text);
            font-family: 'Assistant', sans-serif;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        .admin-field input:focus,
        .admin-field textarea:focus {
            border-color: var(--accent-orange);
        }
        .admin-field input[type="file"] {
            padding: 8px;
        }
        .admin-preview {
            margin-top: 10px;
            max-width: 200px;
            border-radius: var(--radius-sm);
            display: none;
        }
        .admin-actions {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }
        .admin-btn {
            padding: 10px 24px;
            border: none;
            border-radius: var(--radius-sm);
            font-family: 'Heebo', sans-serif;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .admin-btn:hover { transform: scale(1.03); }
        .admin-btn.primary {
            background: linear-gradient(135deg, var(--accent-orange), var(--accent-orange-light));
            color: #fff;
        }
        .admin-btn.primary:hover { box-shadow: 0 4px 15px rgba(255,107,0,0.3); }
        .admin-btn.secondary {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text);
        }
        .admin-status {
            margin-top: 12px;
            padding: 10px;
            border-radius: var(--radius-sm);
            font-size: 13px;
            display: none;
        }
        .admin-status.success { display: block; background: rgba(0,230,118,0.1); color: var(--accent-green); border: 1px solid rgba(0,230,118,0.2); }
        .admin-status.error { display: block; background: rgba(255,71,87,0.1); color: #ff4757; border: 1px solid rgba(255,71,87,0.2); }
        .admin-json-output {
            margin-top: 16px;
            padding: 12px;
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-family: monospace;
            font-size: 12px;
            color: var(--accent-green);
            white-space: pre-wrap;
            word-break: break-all;
            direction: ltr;
            text-align: left;
            display: none;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .product-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }
            .hero h1 { font-size: 26px; }
            .hero p { font-size: 14px; }
            .header-inner { padding: 0 14px; }
            .logo { font-size: 22px; }
            .header-badge { font-size: 12px; padding: 6px 12px; }
            .card-info { padding: 10px 12px 12px; }
            .card-title { font-size: 13px; }
            .card-price { font-size: 18px; }
            .buy-btn { font-size: 13px; padding: 8px 14px; }
            .grid-container { padding: 0 10px 100px; }
            .lightbox-nav { width: 40px; height: 40px; font-size: 20px; }
            .lightbox-prev { left: 10px; }
            .lightbox-next { right: 10px; }
        }

        @media (max-width: 360px) {
            .product-grid { gap: 8px; }
            .card-title { font-size: 12px; }
            .card-price { font-size: 16px; }
        }
    </style>
</head>
<body>

<!-- ===== HEADER ===== -->
<header class="header">
    <div class="header-inner">
        <div class="logo">HaCatalog</div>
        <div class="header-badge">🔥 גלריה חדשה</div>
    </div>
</header>

<!-- ===== HERO ===== -->
<section class="hero">
    <h1>🛍️ <span>הגלריה</span> החדשה שלנו</h1>
    <p>מוצרים נבחרים במחירי רצפה - ישירות אליכם</p>
    <div class="product-count" id="productCount"></div>
</section>

<!-- ===== ADMIN PANEL ===== -->
<div class="admin-panel" id="adminPanel">
    <h2>🔧 ניהול מוצרים</h2>
    <div class="admin-field">
        <label>שם המוצר</label>
        <input type="text" id="adminTitle" placeholder="למשל: נעלי נייקי אייר מקס">
    </div>
    <div class="admin-field">
        <label>מחיר (₪)</label>
        <input type="number" id="adminPrice" placeholder="99">
    </div>
    <div class="admin-field">
        <label>קישור רכישה (הדומיין יוחלף אוטומטית)</label>
        <input type="url" id="adminLink" placeholder="https://..." dir="ltr" oninput="autoReplaceDomain(this)">
    </div>
    <div class="admin-field">
        <label>תמונות וסרטונים (בחירה מרובה)</label>
        <input type="file" id="adminImage" accept="image/*,video/*" multiple>
        <div id="adminPreviewGrid" style="display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;"></div>
    </div>
    <div class="admin-actions">
        <button class="admin-btn primary" onclick="adminUploadMultiple()">📤 העלה מוצרים</button>
        <button class="admin-btn secondary" onclick="adminExportJSON()">📋 ייצא JSON</button>
    </div>
    <div class="admin-status" id="adminStatus"></div>
    <div class="admin-json-output" id="adminJSON"></div>
</div>

<!-- ===== PRODUCT GRID ===== -->
<div class="grid-container">
    <div class="product-grid" id="productGrid"></div>
</div>

<!-- ===== SHARE SECTION ===== -->
<section class="share-section" id="shareSection">
    <h3>📢 שתפו את הגלריה עם חברים</h3>
    <div class="share-buttons">
        <a class="share-btn whatsapp" id="shareWA" href="#" target="_blank">

<script>

let PRODUCTS = [];

}

async function saveProducts() {

        await fetch('https://ali-findme-api.ohadf1976.workers.dev/gallery/products', {
            method: 'POST',

    } catch(e) { console.error('Save error:', e); }
}

/* ========================================================== */

// Cloudflare R2 config (for admin upload)
const R2_CONFIG = {
    accountId: '84c63f0f65cabb8e5b611913c03a1188',
    bucketUrl: 'https://pub-0ad199860b5a4ce0b3fb483660b8a4ca.r2.dev',
    uploadWorkerUrl: 'https://ali-findme-api.ohadf1976.workers.dev/upload'
};

const pageUrl = window.location.href;
const shareText = encodeURIComponent('🛍️ גלריית מוצרים חדשה - מחירי רצפה!\n' + pageUrl);

// Share links
document.getElementById('shareWA').href = `https://wa.me/?text=${shareText}`;
document.getElementById('stickyWA').href = `https://wa.me/?text=${shareText}`;
document.getElementById('shareTG').href = `https://t.me/share/url?url=${encodeURIComponent(pageUrl)}&text=${encodeURIComponent('🛍️ גלריית מוצרים חדשה - מחירי רצפה!')}`;

// Render products
function renderProducts() {
    const grid = document.getElementById('productGrid');
    const countEl = document.getElementById('productCount');
    const shareEl = document.getElementById('shareSection');

    if (PRODUCTS.length === 0) {
        grid.innerHTML = '<div class="empty-state"><div class="empty-icon">📦</div><p>בקרוב יתווספו מוצרים חדשים!</p></div>';
        countEl.style.display = 'none';
        shareEl.style.display = 'none';
        return;
    }

    countEl.innerHTML = `<strong>${PRODUCTS.length}</strong> מוצרים בגלריה`;
    countEl.style.display = 'inline-block';
    shareEl.style.display = 'block';

    grid.innerHTML = PRODUCTS.map((p, i) => `
        <div class="product-card" data-index="${i}">
            <div class="card-image-wrap" onclick="openLightbox(${i})">
                ${p.isVideo ?
                    `<video src="${p.img}" muted loop playsinline style="width:100%;height:100%;object-fit:cover;"></video><div style="position:absolute;top:8px;left:8px;background:rgba(0,0,0,0.7);color:#fff;padding:2px 8px;border-radius:6px;font-size:12px;">🎬 סרטון</div>` :
                    `<img src="${p.img}" alt="${p.title}" loading="lazy">`
                }
                ${p.images && p.images.length > 1 ? `<div style="position:absolute;bottom:8px;left:8px;background:rgba(0,0,0,0.7);color:#fff;padding:3px 8px;border-radius:6px;font-size:12px;">📸 ${p.images.length}</div>` : ''}
                <div class="card-zoom-icon">🔍</div>
            </div>
            <div class="card-info">
                <div class="card-title">${p.title}</div>
                <div class="card-price">₪${p.price} <span>כולל משלוח</span></div>
                <a href="https://wa.me/?text=${encodeURIComponent('👀 תראי מה מצאתי!\n' + p.title + ' - ₪' + p.price + '\n' + window.location.origin + window.location.pathname + '?p=' + i)}" target="_blank" class="wa-share-btn" onclick="event.stopPropagation()">💬 שתפו לחברה</a>
                <button class="copy-product-link" onclick="event.stopPropagation();copyProductLink(${i})">🔗 העתק קישור</button>
                <a href="${p.link}" target="_blank" rel="noopener" class="buy-btn">🛒 לרכישה</a>
                ${IS_ADMIN ? `<div class="admin-btns" style="display:flex;gap:6px;margin-top:6px;">
                    <button onclick="event.stopPropagation();editProduct(${i})" style="flex:1;padding:8px;border:1px solid #ff0;background:transparent;color:#ff0;border-radius:8px;cursor:pointer;font-size:13px;">✏️ ערוך</button>
                    <button onclick="event.stopPropagation();deleteProduct(${i})" style="flex:1;padding:8px;border:1px solid #f44;background:transparent;color:#f44;border-radius:8px;cursor:pointer;font-size:13px;">🗑️ מחק</button>
                </div>` : ''}
            </div>
        </div>
    `).join('');

    observeCards();
}

// Scroll animations
function observeCards() {
    const observer = new IntersectionObserver((entries) => {
        entries.forEach((entry, i) => {
            if (entry.isIntersecting) {
                setTimeout(() => {
                    entry.target.classList.add('visible');
                }, i * 60);
                observer.unobserve(entry.target);
            }
        });
    }, { threshold: 0.1 });

    document.querySelectorAll('.product-card').forEach(card => observer.observe(card));
}

// Lightbox with multi-image support
let currentLightbox = 0;
let currentLbImage = 0;
let currentLbImages = [];

function openLightbox(index) {
    currentLightbox = index;
    const p = PRODUCTS[index];
    currentLbImages = p.images || [p.img];
    currentLbImage = 0;
    showLbImage();
    document.getElementById('lightbox').classList.add('active');
    document.body.style.overflow = 'hidden';
}

function showLbImage() {
    const p = PRODUCTS[currentLightbox];
    const src = currentLbImages[currentLbImage];
    const isVid = p.isVideos && p.isVideos[currentLbImage];
    const imgEl = document.getElementById('lightboxImg');

    if (isVid) {
        imgEl.style.display = 'none';
        let vid = document.getElementById('lightboxVid');
        if (!vid) {
            vid = document.createElement('video');
            vid.id = 'lightboxVid';
            vid.controls = true;
            vid.autoplay = true;
            vid.style.cssText = 'max-width:90vw;max-height:80vh;border-radius:12px;';
            imgEl.parentNode.insertBefore(vid, imgEl);
        }
        vid.src = src;
        vid.style.display = 'block';
    } else {
        imgEl.src = src;
        imgEl.alt = p.title;
        imgEl.style.display = 'block';
        const vid = document.getElementById('lightboxVid');
        if (vid) { vid.pause(); vid.style.display = 'none'; }
    }

    const counter = currentLbImages.length > 1 ? ` (${currentLbImage + 1}/${currentLbImages.length})` : '';
    document.getElementById('lightboxTitle').textContent = p.title + counter;
    document.getElementById('lightboxWAShare').href = 'https://wa.me/?text=' + encodeURIComponent('👀 תראי מה מצאתי!\n' + p.title + ' - ₪' + p.price + '\n' + window.location.origin + window.location.pathname + '?p=' + currentLightbox);
}

function closeLightbox() {
    document.getElementById('lightbox').classList.remove('active');
    document.body.style.overflow = '';
    const vid = document.getElementById('lightboxVid');
    if (vid) { vid.pause(); vid.style.display = 'none'; }
}

function navLightbox(dir) {
    if (currentLbImages.length > 1) {
        // Navigate within product images
        currentLbImage = (currentLbImage - dir + currentLbImages.length) % currentLbImages.length;
    } else {
        // Navigate between products
        currentLightbox = (currentLightbox - dir + PRODUCTS.length) % PRODUCTS.length;
        const p = PRODUCTS[currentLightbox];
        currentLbImages = p.images || [p.img];
        currentLbImage = 0;
    }
    showLbImage();
}

document.getElementById('lightbox').addEventListener('click', (e) => {
    if (e.target === e.currentTarget) closeLightbox();
});

document.addEventListener('keydown', (e) => {
    if (!document.getElementById('lightbox').classList.contains('active')) return;
    if (e.key === 'Escape') closeLightbox();
    if (e.key === 'ArrowRight') navLightbox(-1); // RTL
    if (e.key === 'ArrowLeft') navLightbox(1);
});

// Copy individual product link
function copyProductLink(index) {
    const p = PRODUCTS[index];
    const link = window.location.origin + window.location.pathname + '?p=' + index;
    navigator.clipboard.writeText(link).then(() => {
        showToast('✅ קישור למוצר הועתק!');
    }).catch(() => {
        // Fallback for mobile
        const ta = document.createElement('textarea');
        ta.value = link;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        showToast('✅ קישור למוצר הועתק!');
    });
}

// Edit product (admin)
function editProduct(index) {

            <label style="color:#aaa;font-size:13px;">קישור רכישה</label>
            <input id="editLink" value="${p.link || ''}" style="width:100%;padding:10px;margin:6px 0 12px;background:#0f0f1a;border:1px solid #333;color:#fff;border-radius:8px;font-size:15px;direction:ltr;">
            <label style="color:#aaa;font-size:13px;">מחיר Zara מקורי (₪)</label>

                <button onclick="this.closest('div[style*=fixed]').remove()" style="flex:1;padding:12px;background:transparent;border:1px solid #555;color:#fff;border-radius:10px;font-size:16px;cursor:pointer;">ביטול</button>
            </div>
        </div>
    `;
    document.body.appendChild(overlay);
}

async function saveEdit(index) {
    const title = document.getElementById('editTitle').value;
    const price = parseInt(document.getElementById('editPrice').value) || 0;
    const link = document.getElementById('editLink').value;
    const zaraPrice = parseInt(document.getElementById('editZaraPrice').value) || 0;

    PRODUCTS[index].title = title;
    PRODUCTS[index].price = price;
    PRODUCTS[index].link = link;
    if (zaraPrice) PRODUCTS[index].zaraPrice = zaraPrice;

    try {
        await fetch(API_BASE + '/gallery/products', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({products: PRODUCTS})
        });
        document.querySelector('div[style*="fixed"]').remove();
        renderProducts();
        showToast('✅ המוצר עודכן!');
    } catch(e) {
        showToast('❌ שגיאה: ' + e.message);
    }
}

async function deleteProduct(index) {
    const p = PRODUCTS[index];
    if (!confirm('למחוק את "' + p.title + '"?')) return;

    PRODUCTS.splice(index, 1);
    try {
        await fetch(API_BASE + '/gallery/products', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({products: PRODUCTS})
        });
        renderProducts();
        showToast('🗑️ המוצר נמחק!');
    } catch(e) {
        showToast('❌ שגיאה: ' + e.message);
    }
}

// Copy link
function copyLink() {
    navigator.clipboard.writeText(window.location.href).then(() => {
        showToast('✅ הקישור הועתק!');
    });
}

function showToast(msg) {
    const t = document.getElementById('toast');

}

// ===== ADMIN PANEL =====
if (new URLSearchParams(window.location.search).get('admin') === '1') {
    document.getElementById('adminPanel').classList.add('active');
}

// Auto-replace domain in buy links
function autoReplaceDomain(input) {
    const val = input.value.trim();
    if (!val.startsWith('http')) return;
    try {
        const url = new URL(val);
        if (url.hostname !== 'kerenmutagimil.com') {
            input.value = 'https://kerenmutagimil.com' + url.pathname + url.search + url.hash;
        }

// Multiple file preview with main image selection
let selectedMainIndex = 0;

document.getElementById('adminImage').addEventListener('change', (e) => {
    const grid = document.getElementById('adminPreviewGrid');
    grid.innerHTML = '';
    selectedMainIndex = 0;
    const files = Array.from(e.target.files);
    if (files.length > 1) {
        const hint = document.createElement('div');
        hint.style.cssText = 'width:100%;color:#ffa500;font-size:13px;margin-bottom:6px;';
        hint.textContent = '👆 לחצו על תמונה לבחור אותה כראשית';
        grid.appendChild(hint);
    }
    files.forEach((file, i) => {
        const wrap = document.createElement('div');
        wrap.style.cssText = 'position:relative;width:80px;height:80px;border-radius:8px;overflow:hidden;cursor:pointer;' + (i === 0 ? 'border:3px solid #00e676;box-shadow:0 0 10px rgba(0,230,118,0.5);' : 'border:2px solid #333;');
        wrap.dataset.index = i;
        wrap.onclick = function() {
            selectedMainIndex = i;
            grid.querySelectorAll('div[data-index]').forEach(d => {
                d.style.border = '2px solid #333';
                d.style.boxShadow = 'none';
                const star = d.querySelector('.main-star');
                if (star) star.remove();
            });
            this.style.border = '3px solid #00e676';
            this.style.boxShadow = '0 0 10px rgba(0,230,118,0.5)';
            const star = document.createElement('div');
            star.className = 'main-star';
            star.textContent = '⭐ ראשית';
            star.style.cssText = 'position:absolute;top:2px;right:2px;background:#00e676;color:#000;font-size:9px;padding:1px 4px;border-radius:4px;font-weight:bold;';
            this.appendChild(star);
        };
        if (file.type.startsWith('video/')) {
            const vid = document.createElement('video');
            vid.src = URL.createObjectURL(file);
            vid.style.cssText = 'width:100%;height:100%;object-fit:cover;';
            vid.muted = true;
            const badge = document.createElement('div');
            badge.textContent = '🎬';
            badge.style.cssText = 'position:absolute;top:2px;left:2px;font-size:16px;';
            wrap.appendChild(vid);
            wrap.appendChild(badge);
        } else {
            const img = document.createElement('img');
            img.src = URL.createObjectURL(file);
            img.style.cssText = 'width:100%;height:100%;object-fit:cover;';
            wrap.appendChild(img);
        }
        if (i === 0) {
            const star = document.createElement('div');
            star.className = 'main-star';
            star.textContent = '⭐ ראשית';
            star.style.cssText = 'position:absolute;top:2px;right:2px;background:#00e676;color:#000;font-size:9px;padding:1px 4px;border-radius:4px;font-weight:bold;';
            wrap.appendChild(star);
        }
        const num = document.createElement('div');
        num.textContent = (i+1);
        num.style.cssText = 'position:absolute;bottom:2px;right:4px;color:#fff;font-size:11px;background:rgba(0,0,0,0.6);border-radius:4px;padding:1px 5px;';
        wrap.appendChild(num);
        grid.appendChild(wrap);
    });
});

async function adminUploadMultiple() {
    const title = document.getElementById('adminTitle').value.trim();
    const price = document.getElementById('adminPrice').value.trim();
    const link = document.getElementById('adminLink').value.trim();
    const fileInput = document.getElementById('adminImage');
    const statusEl = document.getElementById('adminStatus');
    const allFiles = Array.from(fileInput.files);
    // Move selected main image to first position
    const files = [];
    if (selectedMainIndex > 0 && selectedMainIndex < allFiles.length) {
        files.push(allFiles[selectedMainIndex]);
        allFiles.forEach((f, i) => { if (i !== selectedMainIndex) files.push(f); });
    } else {
        files.push(...allFiles);
    }

    if (!title || !price || !link) {
        statusEl.className = 'admin-status error';
        statusEl.textContent = '❌ יש למלא שם, מחיר וקישור';
        statusEl.style.display = 'block';
        return;
    }

    if (files.length === 0) {
        statusEl.className = 'admin-status error';
        statusEl.textContent = '❌ יש לבחור תמונות או סרטונים';
        statusEl.style.display = 'block';
        return;
    }

    statusEl.className = 'admin-status';
    statusEl.style.display = 'block';
    statusEl.style.background = 'rgba(255,255,255,0.05)';
    statusEl.style.color = 'var(--text-dim)';
    statusEl.style.border = '1px solid var(--border)';

    let uploaded = 0;
    const uploadedMedia = [];

    for (const file of files) {
        uploaded++;
        statusEl.textContent = `⏳ מעלה ${uploaded}/${files.length}...`;
        let mediaUrl = '';
        const isVideo = file.type.startsWith('video/');

        if (R2_CONFIG.uploadWorkerUrl) {
            try {
                const ext = file.name.split('.').pop() || (isVideo ? 'mp4' : 'jpg');
                const key = `gallery/${Date.now()}_${uploaded}.${ext}`;
                const buf = await file.arrayBuffer();
                const resp = await fetch(R2_CONFIG.uploadWorkerUrl.replace('/upload', '/r2put') + '?key=' + encodeURIComponent(key), {
                    method: 'PUT',
                    headers: { 'Content-Type': file.type || 'image/jpeg' },
                    body: buf
                });
                const data = await resp.json();
                if (!resp.ok || !data.success) throw new Error(data.error || 'Upload failed: ' + resp.status);
                mediaUrl = `${R2_CONFIG.bucketUrl}/${data.key}`;
            } catch (err) {
                statusEl.className = 'admin-status error';
                statusEl.textContent = '❌ שגיאה בהעלאה: ' + err.message;
                statusEl.style.display = 'block';
                return;
            }
        } else {
            mediaUrl = URL.createObjectURL(file);
        }

        uploadedMedia.push({ url: mediaUrl, isVideo: isVideo });
    }

    const product = {
        img: uploadedMedia[0].url,
        images: uploadedMedia.map(m => m.url),
        isVideos: uploadedMedia.map(m => m.isVideo),
        title: title,
        price: Number(price),
        link: link,
        isVideo: uploadedMedia[0].isVideo
    };

    PRODUCTS.push(product);
    renderProducts();
    try {
        await saveProducts();
        statusEl.className = 'admin-status success';
        statusEl.textContent = `✅ "${title}" נוסף עם ${files.length} תמונות!`;
    } catch(e) {
        statusEl.className = 'admin-status error';
        statusEl.textContent = '❌ המוצר נוסף אבל שמירה נכשלה: ' + e.message;
    }

    // Clear form
    document.getElementById('adminTitle').value = '';
    document.getElementById('adminPrice').value = '';
    document.getElementById('adminLink').value = '';
    fileInput.value = '';
    document.getElementById('adminPreviewGrid').innerHTML = '';
}

function adminExportJSON() {
    const jsonEl = document.getElementById('adminJSON');
    if (PRODUCTS.length === 0) {
        jsonEl.style.display = 'block';
        jsonEl.textContent = '// אין מוצרים. הוסיפו מוצרים ולחצו שוב.\nconst PRODUCTS = [];';
        return;
    }
    const json = JSON.stringify(PRODUCTS, null, 2);
    jsonEl.style.display = 'block';
    jsonEl.textContent = `const PRODUCTS = ${json};`;

    // Copy to clipboard
    navigator.clipboard.writeText(`const PRODUCTS = ${json};`).then(() => {
        showToast('✅ JSON הועתק ללוח!');
    });
}

// Init - load products from cloud
loadProducts().then(() => {
    const params = new URLSearchParams(window.location.search);
    const pIdx = params.get('p');
    if (pIdx !== null && PRODUCTS[parseInt(pIdx)]) {
        // Single product view - show only this product with built-in gallery
        const p = PRODUCTS[parseInt(pIdx)];
        const i = parseInt(pIdx);
        const imgs = p.images || [p.img];
        document.querySelector('.hero').style.display = 'none';

        // Build image gallery with swipe
        let spIdx = 0;
        document.getElementById('productGrid').innerHTML = `
            <div style="grid-column:1/-1;max-width:500px;margin:0 auto;">
                <div class="product-card visible" data-index="${i}">
                    <div style="position:relative;overflow:hidden;border-radius:12px;background:#111;">
                        <img id="spMainImg" src="${imgs[0]}" alt="${p.title}" style="width:100%;display:block;">
                        ${imgs.length > 1 ? `
                            <button onclick="spNav(-1)" style="position:absolute;top:50%;left:10px;transform:translateY(-50%);width:40px;height:40px;background:rgba(0,0,0,0.6);border:2px solid rgba(255,255,255,0.3);border-radius:50%;color:#fff;font-size:20px;cursor:pointer;z-index:5;">›</button>
                            <button onclick="spNav(1)" style="position:absolute;top:50%;right:10px;transform:translateY(-50%);width:40px;height:40px;background:rgba(0,0,0,0.6);border:2px solid rgba(255,255,255,0.3);border-radius:50%;color:#fff;font-size:20px;cursor:pointer;z-index:5;">‹</button>
                            <div id="spCounter" style="position:absolute;bottom:10px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.7);color:#fff;padding:4px 12px;border-radius:12px;font-size:13px;">1 / ${imgs.length}</div>
                        ` : ''}
                    </div>
                    ${imgs.length > 1 ? `
                        <div id="spThumbs" style="display:flex;gap:6px;overflow-x:auto;padding:10px 0;"></div>
                    ` : ''}
                    <div class="card-info">
                        <div class="card-title" style="font-size:18px;-webkit-line-clamp:unset;">${p.title}</div>
                        <div class="card-price" style="font-size:24px;">₪${p.price} <span>כולל משלוח</span></div>
                        <a href="https://wa.me/?text=${encodeURIComponent('👀 תראי מה מצאתי!\n' + p.title + ' - ₪' + p.price + '\n' + window.location.href)}" target="_blank" class="wa-share-btn">💬 שתפו לחברה</a>
                        <a href="${p.link}" target="_blank" rel="noopener" class="buy-btn" style="font-size:18px;padding:14px;">🛒 לרכישה</a>
                    </div>
                </div>
                <a href="${window.location.pathname}" style="display:block;text-align:center;color:#aaa;margin-top:20px;text-decoration:none;font-size:14px;">← לכל המוצרים בגלריה</a>
            </div>
        `;

        // Build thumbnails
        const spImages = imgs;
        if (imgs.length > 1) {
            const thumbs = document.getElementById('spThumbs');
            imgs.forEach((img, idx) => {
                const th = document.createElement('img');
                th.src = img;
                th.style.cssText = 'width:60px;height:60px;object-fit:cover;border-radius:8px;cursor:pointer;flex-shrink:0;' + (idx === 0 ? 'border:2px solid #00e676;' : 'border:2px solid #333;opacity:0.6;');
                th.onclick = () => spGoTo(idx);
                thumbs.appendChild(th);
            });
        }

        // Navigation functions
        window.spNav = function(dir) {
            spIdx = (spIdx - dir + spImages.length) % spImages.length;
            spGoTo(spIdx);
        };
        window.spGoTo = function(idx) {
            spIdx = idx;
            document.getElementById('spMainImg').src = spImages[idx];
            document.getElementById('spCounter').textContent = (idx + 1) + ' / ' + spImages.length;
            const thumbs = document.getElementById('spThumbs');
            if (thumbs) {
                thumbs.querySelectorAll('img').forEach((th, j) => {
                    th.style.border = j === idx ? '2px solid #00e676' : '2px solid #333';
                    th.style.opacity = j === idx ? '1' : '0.6';
                });
            }
        };

        // Swipe support for mobile
        let touchStartX = 0;
        const mainImg = document.getElementById('spMainImg');
        mainImg.addEventListener('touchstart', (e) => { touchStartX = e.touches[0].clientX; });
        mainImg.addEventListener('touchend', (e) => {
            const diff = touchStartX - e.changedTouches[0].clientX;
            if (Math.abs(diff) > 50) {
                if (diff > 0) spNav(-1); // swipe left = next (RTL)
                else spNav(1); // swipe right = prev
            }
        });
    }
});
</script>
</body>
</html>
